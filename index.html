<style>

*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse 80% 500px at 5% -100px,#1e3455 0%,transparent 70%),var(--bg);min-height:100vh}a{color:var(--gold)}button,select,input,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}.layout{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}.sidebar{background:#0c1829;border-right:1px solid var(--border);padding:28px 14px;position:sticky;top:0;height:100vh}.brand{padding:0 8px 22px}.brandmark{font-size:21px;letter-spacing:.085em;line-height:1.05;font-weight:850}.brandmark span{color:var(--gold)}.eyebrow{font-size:10px;font-weight:750;color:var(--gold);letter-spacing:.15em;text-transform:uppercase}.tag{font-size:11px;border:1px solid #675f43;border-radius:999px;padding:4px 9px;color:#f6db9d;display:inline-flex;gap:5px;align-items:center;background:#5348272b}.sidenav{display:grid;gap:5px;margin-top:20px}.nav{display:flex;align-items:center;gap:9px;text-align:left;color:#b8c5d4;border:1px solid transparent;background:none;padding:11px 12px;border-radius:10px;width:100%;font-size:13px}.nav:hover,.nav.active{background:#1b2b43;color:var(--ivory);border-color:#354967}.nav .symbol{font-size:16px;width:20px}.side-note{margin-top:25px;padding:14px 12px;background:#1b2534;border:1px solid #304052;border-radius:12px;font-size:11px;color:var(--muted);line-height:1.6}.main{min-width:0;max-width:1400px;width:100%;margin:auto;padding:24px 34px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:24px;flex-wrap:wrap}.topbar-right{display:flex;gap:10px;align-items:center}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(29px,4vw,48px);line-height:1.05;margin:5px 0 12px;letter-spacing:-.04em}h2{font-size:21px;letter-spacing:-.02em;margin-bottom:14px}h3{font-size:17px;margin-bottom:10px}p{line-height:1.62}.lead{color:#c7d0df;max-width:750px;font-size:15px}.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:10px}.flex{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.stack{display:grid;gap:16px}.cols-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.cols-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.cols-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.panel{background:linear-gradient(145deg,#14223a,#101c30);border:1px solid var(--border);border-radius:var(--r);padding:22px;min-width:0}.panel.plain{background:var(--surface)}.hero{padding:36px;border:1px solid #615638;border-radius:24px;background:radial-gradient(ellipse at top right,#7154264f,transparent 50%),linear-gradient(120deg,#1b304c,#0b172b);overflow:hidden}.hero-art{min-height:235px;background:radial-gradient(circle at 52% 35%,#d7ae5a5a,transparent 31%),repeating-radial-gradient(circle at 55% 47%,#d4b87517 0px,#d4b87517 2px,transparent 3px,transparent 15px),#0f1a2b;border-radius:15px;border:1px solid #6d5b3e;display:grid;place-items:center;position:relative;overflow:hidden}.hero-art:after{content:'✦';font-size:170px;color:#dac28a4f;transform:rotate(-18deg)}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid #596c88;border-radius:10px;background:#1d314e;color:var(--ivory);padding:10px 16px;font-weight:700;font-size:13px;min-height:40px}.btn:hover:not(:disabled){border-color:#93aac6;background:#294466}.btn.primary{background:var(--gold);color:#14223c;border-color:#e4ca90}.btn.primary:hover:not(:disabled){background:#f1d595}.btn.danger{border-color:#8b5160;color:#ffc0be;background:#44212a}.btn.smallbtn{min-height:30px;padding:6px 10px;font-size:11px}.btn.ghost{background:transparent}.metric{background:#101f35;border:1px solid #33435c;padding:20px;border-radius:14px}.metric strong{font-size:29px;display:block;line-height:1.25;margin-top:7px;color:var(--ivory)}.metric span{font-size:11px;color:var(--muted)}.pill{padding:5px 10px;border-radius:999px;border:1px solid var(--border);font-size:11px;color:#c8d1df}.pill.gold{border-color:#827248;background:#83703d18;color:#e3ce9c}.pill.green{color:var(--green);border-color:#2a7856}.pill.red{color:var(--red)}input,select,textarea{background:#0b182b;color:var(--ivory);border:1px solid #50607a;border-radius:10px;padding:10px 12px;width:100%;min-width:0}input[type=range]{padding:0;accent-color:var(--gold)}textarea{min-height:112px}label{font-size:12px;color:#d4dceb;display:block;margin:0 0 6px}.formrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:15px}.tcg-card{border:2px solid #807050;background:#192438;aspect-ratio:63/88;border-radius:13px;position:relative;padding:7px;box-shadow:0 15px 28px #0007;display:flex;flex-direction:column;gap:4px;overflow:hidden;min-width:0}.tcg-card[data-grade=SR],.tcg-card[data-grade=UR]{border-color:#a78cd1;box-shadow:0 0 0 1px #ba9dd066,0 12px 24px #0007}.tcg-card[data-grade=L]{border-color:#f6d38a;box-shadow:0 0 18px #a8804160}.tcg-head{display:flex;align-items:center;justify-content:space-between;font-size:9px;letter-spacing:.04em;font-weight:800;color:#fff}.tcg-picture{position:relative;flex:1;min-height:0;border:1px solid #88795b;background:radial-gradient(circle at 50% 40%,#be92546e,transparent 38%),repeating-linear-gradient(120deg,#6483a52e,#6483a52e 2px,transparent 3px,transparent 17px),linear-gradient(150deg,#233a58,#151c31);display:grid;place-items:center;overflow:hidden;border-radius:5px}.tcg-picture:after{content:'✦';font-size:63px;color:#e2c58a70;text-shadow:0 0 22px #d7aa89aa}.tcg-picture.technique{background:radial-gradient(circle at 50% 40%,#739aca65,transparent 38%),linear-gradient(135deg,#19314c,#111a32)}.tcg-picture.equipement{background:radial-gradient(circle at 50% 40%,#ba897865,transparent 38%),linear-gradient(135deg,#463432,#151b2f)}.tcg-picture.evenement{background:radial-gradient(circle at 50% 40%,#a183c965,transparent 38%),linear-gradient(135deg,#31254e,#13192f)}.tcg-name{font-size:10px;font-weight:850;text-align:center;min-height:28px;display:grid;place-items:center;background:#c9b079;color:#182334;border-radius:3px;padding:4px 3px}.tcg-stats{display:flex;justify-content:space-around;gap:2px;font-size:8px}.tcg-stats b{display:block;font-size:10px;color:#fff;text-align:center}.tcg-foot{font-size:8px;color:#aebbd0;text-align:center}.card-item{display:grid;gap:8px}.card-counter{border:1px solid #42526c;border-radius:10px;padding:7px 11px;background:#15253b;font-size:12px;text-align:center}.table-wrap{overflow-x:auto}.table{border-collapse:collapse;width:100%;font-size:13px}.table th{text-align:left;font-size:11px;color:var(--muted);padding:12px;border-bottom:1px solid var(--border)}.table td{padding:12px;border-bottom:1px solid #34435b}.numberlist{display:grid;gap:12px}.step{display:flex;gap:13px;align-items:flex-start}.step b{border:1px solid var(--gold);color:var(--gold);border-radius:50%;min-width:26px;height:26px;display:grid;place-items:center;font-size:12px}.toast{position:fixed;bottom:22px;right:22px;background:#254263;border:1px solid #7588a1;box-shadow:0 15px 35px #000a;padding:14px 19px;border-radius:12px;z-index:100;max-width:350px;font-size:13px}.mutedblock{padding:15px;border-radius:10px;background:#0b182a;border:1px dashed #42516a;color:#abb9ca;font-size:12px}.art-preview{aspect-ratio:63/88;width:min(100%,285px);background:#1a2b48;padding:10px;border:2px solid var(--gold);border-radius:14px;box-shadow:0 18px 36px #0008;display:flex;flex-direction:column;gap:8px}.art-preview img{width:100%;flex:1;min-height:0;object-fit:cover;border-radius:7px;border:1px solid #8b835b}.art-stage{flex:1;display:grid;place-items:center;border:1px dashed #76899f;min-height:0;background:repeating-linear-gradient(45deg,#263c57,#263c57 9px,#1a2c45 10px,#1a2c45 20px);font-size:14px;color:#c9d2e0}.art-preview .artist-stats{display:flex;justify-content:space-evenly;font-size:9px}.progress{height:7px;background:#1d2d45;border-radius:8px;overflow:hidden}.progress div{height:100%;background:var(--gold)}.footer{border-top:1px solid #36445b;padding-top:20px;margin-top:45px;font-size:11px;color:var(--muted)}
@media(max-width:900px){.layout{display:block}.sidebar{position:static;width:100%;height:auto;padding:12px}.brand{display:flex;justify-content:space-between;align-items:center;padding:5px}.sidenav{display:flex;gap:5px;overflow:auto;margin-top:9px}.nav{white-space:nowrap;padding:8px 10px;width:auto}.side-note{display:none}.main{padding:18px 16px 55px}.cols-3,.cols-4{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:24px}.hero-art{min-height:150px}}@media(max-width:560px){.cols-2,.cols-3,.cols-4,.formrow{grid-template-columns:1fr}.hero{padding:20px}.tcg-card{max-width:none}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.panel{padding:16px}.metric strong{font-size:24px}}

.tcg-card.card-open{width:100%;color:inherit;text-align:initial;cursor:pointer;font-family:inherit;transition:transform .15s ease,border-color .15s ease}
.tcg-card.card-open:hover{transform:translateY(-4px);border-color:var(--gold)}
.tcg-card.card-open:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.details-carte-demo{background:#101e33;color:var(--ivory);border:1px solid var(--gold);border-radius:18px;box-shadow:0 25px 70px #000b;padding:24px;width:min(92vw,620px);max-height:85vh;overflow-y:auto}
.details-carte-demo::backdrop{background:#020916db}
.details-carte-demo .modal-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.details-carte-demo .modal-stats .metric{padding:13px}
.details-carte-demo .modal-stats strong{font-size:23px}
@media(max-width:570px){.details-carte-demo{padding:15px}.details-carte-demo .modal-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head>
<body><div id="app"></div>
<script>
'use strict';
const ROSTER=['Eugen Sandow','Katie Sandwina','Louis Cyr','George Hackenschmidt','Paavo Nurmi','Jim Thorpe','Major Taylor','Jack Johnson','Charlotte Cooper','Suzanne Lenglen','Gertrude Ederle','Madge Syers','Betty Robinson','Alice Coachman','Alfonsina Strada','Joe Gans','Duke Kahanamoku','Sonja Henie','Lily Parr','Arthur Wharton','George Eyser','Esmé MacKinnon','Ellen Osiier','John B. Kelly Sr.'];
const FAMILIES=[['Athlètes',24],['Capitaines',8],['Techniques',32],['Équipements',20],['Événements',16],['Évolutions sportives',12],['Encadrements',4],['Arènes / Sites',4]];
const GRADES=[['C',48],['UC',36],['R',24],['DR',12],['SR',24],['UR',10],['SEC',4],['L',2]];
const STAT_NAMES=[['F','FORCE'],['T','TECHNIQUE'],['E','ENDURANCE'],['I','IMPACT']];
const TYPES={athlete:'Athlète',technique:'Technique',equipement:'Équipement',evenement:'Événement'};
const QUOTAS={athlete:6,technique:8,equipement:4,evenement:2};
const DEMO_CARDS=[];
for(let i=0;i<6;i++){
  const stats=[5+(i%3),4+((i+1)%4),4+((i+2)%3),4+((i+3)%3)];
  DEMO_CARDS.push({id:'DEMO-A'+(i+1),nom:'Athlète prototype '+String.fromCharCode(65+i),type:'athlete',grade:['C','UC','R','DR','SR','L'][i],stats,part:'ATHLÈTE FICTIF'});
}
for(const [type,n] of [['technique',12],['equipement',8],['evenement',6]]){
 for(let i=0;i<n;i++){
  const codes={technique:'T',equipement:'EQ',evenement:'EV'};
  DEMO_CARDS.push({id:'DEMO-'+codes[type]+(i+1),nom:TYPES[type]+' test '+String(i+1).padStart(2,'0'),type,grade:['C','UC','R','DR','SR','UR','SEC','L'][i%8],stats:null,part:'SUPPORT FICTIF'});
 }
}
const CARD_MAP=Object.fromEntries(DEMO_CARDS.map(c=>[c.id,c]));
const STARTER=[...DEMO_CARDS.filter(c=>c.type==='athlete'),...DEMO_CARDS.filter(c=>c.type==='technique').slice(0,8),...DEMO_CARDS.filter(c=>c.type==='equipement').slice(0,4),...DEMO_CARDS.filter(c=>c.type==='evenement').slice(0,2)];
const defaultState=()=>({starter:false,inv:{},deck:{},opened:0,drawn:[],rounds:[],matches:[],trades:[],alias:'Artiste invité',subject:ROSTER[0],grade:'C',sim:{boosters:5000,abos:10000,physique:0,artistes:10},notes:[],mode:'joueur'});
let state;let screen='accueil', filterCatalogue='', filterAlbum='tous',notifTimer=0,previewUrl=null;
const LOCAL_KEY='ATHLETIC_MASTERS_ARTIST_BETA_OFFLINE_V01';
function load(){try{const saved=JSON.parse(localStorage.getItem(LOCAL_KEY)||'null');return saved?{...defaultState(),...saved,sim:{...defaultState().sim,...saved.sim}}:defaultState()}catch{return defaultState()}}
function persist(){try{localStorage.setItem(LOCAL_KEY,JSON.stringify(state))}catch{}}
state=load();
function html(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return Number(n).toLocaleString('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:2})}
function card(c,number=null){return `<div class="card-item"><button type="button" class="tcg-card card-open" data-action="open-card" data-id="${c.id}" data-grade="${c.grade}" aria-label="Voir les détails de ${html(c.nom)}"><div class="tcg-head"><span>ATHLETIC MASTERS</span><span>${c.grade}</span></div><div class="tcg-picture ${c.type}" aria-hidden="true"></div><div class="tcg-name">${html(c.nom)}</div>${c.stats?`<div class="tcg-stats">${c.stats.map((v,i)=>`<span title="${STAT_NAMES[i][1]}">${STAT_NAMES[i][0]}<b>${v}</b></span>`).join('')}</div>`:`<div class="tcg-stats">${html(TYPES[c.type])} · DÉMO</div>`}<div class="tcg-foot">Illustration fictive · Sans valeur commerciale</div></button>${number===null?'':`<div class="card-counter">Possédés : ${number}</div>`}</div>`}

function showCardDetails(id){
  const c=CARD_MAP[id]; if(!c)return;
  document.getElementById('details-carte-demo')?.remove();
  const dlg=document.createElement('dialog');
  dlg.id='details-carte-demo';
  dlg.className='details-carte-demo';
  const stats=c.stats?'<div class="modal-stats">'+c.stats.map((v,i)=>'<div class="metric"><span>'+html(STAT_NAMES[i][1])+'</span><strong>'+v+'</strong></div>').join('')+'</div>':'<p class="muted">Cette carte de soutien ne possède aucune statistique de démonstration.</p>';
  const quantity=state.inv[id]||0,used=state.deck[id]||0;
  dlg.innerHTML='<div class="between"><span class="eyebrow">FICHE DE CARTE · DÉMONSTRATION</span><button type="button" class="btn smallbtn" id="fermer-carte-demo" aria-label="Fermer la fiche">✕ Fermer</button></div>'+
    '<h2 style="margin-top:18px">'+html(c.nom)+'</h2>'+
    '<p class="small muted">Carte totalement fictive. Aucun record historique, effet ou tarif officiel.</p>'+
    '<div class="flex" style="margin:16px 0"><span class="pill gold">Rareté : '+html(c.grade)+'</span><span class="pill">Type : '+html(TYPES[c.type]||c.type)+'</span></div>'+
    stats+
    '<div class="cols-2" style="margin-top:14px"><div class="metric"><span>Possédées</span><strong>'+quantity+'</strong></div><div class="metric"><span>Dans le deck</span><strong>'+used+'</strong></div></div>'+
    '<p class="muted small" style="margin-top:16px">Illustration graphique provisoire, non attribuée à un artiste. La rareté et la finition ne changent pas le gameplay du prototype.</p>';
  document.body.appendChild(dlg);
  dlg.addEventListener('close',()=>dlg.remove(),{once:true});
  dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close();});
  dlg.querySelector('#fermer-carte-demo').addEventListener('click',()=>dlg.close());
  dlg.showModal();
  dlg.querySelector('#fermer-carte-demo').focus();
}
function navButton(id,sym,name){return `<button class="nav ${screen===id?'active':''}" data-action="nav" data-id="${id}"><span class="symbol">${sym}</span>${name}</button>`}
function currentCount(id){return state.inv[id]||0}
function deckCount(id){return state.deck[id]||0}
function totalOwned(){return Object.values(state.inv).reduce((a,b)=>a+b,0)}
function deckTotal(){return Object.values(state.deck).reduce((a,b)=>a+b,0)}
function deckQuotaCounts(){const res={athlete:0,technique:0,equipement:0,evenement:0};for(const [id,n] of Object.entries(state.deck)){if(CARD_MAP[id])res[CARD_MAP[id].type]+=n}return res}
function deckIssues(){const q=deckQuotaCounts();const issues=[];for(const type in QUOTAS)if(q[type]!==QUOTAS[type])issues.push(TYPES[type]+' : '+q[type]+'/'+QUOTAS[type]);for(const [id,n]of Object.entries(state.deck)){if(n>currentCount(id))issues.push('Possession insuffisante : '+id);if(n>(CARD_MAP[id]?.type==='athlete'?1:2))issues.push('Quantité max dépassée : '+id)}return issues}
function header(){return `<div class="top"><div><span class="eyebrow">PREMIÈRE COLLECTION — LEGENDS: THE PIONEERS</span><div style="margin-top:6px"><span class="tag">◆ DÉMONSTRATION NON COMMERCIALE</span></div></div><div class="topbar-right"><span class="pill">Stockage local</span><span class="pill gold">${state.mode==='joueur'?'Mode joueur':'Mode artiste'}</span></div></div>`}
function accueil(){return `${header()}<section class="hero cols-2"><div><span class="eyebrow">SPORT · HISTOIRE · ART</span><h1>Les légendes du sport.<br><span style="color:var(--gold)">Vos univers artistiques.</span></h1><p class="lead">Découvrez un futur jeu de cartes à collectionner, construit autour de figures historiques et d'œuvres indépendantes. Ce prototype vous permet de tester l'expérience sans compte et sans argent.</p><div class="flex"><button class="btn primary" data-action="mode" data-id="joueur">Explorer comme joueur →</button><button class="btn" data-action="mode" data-id="artiste">Explorer comme artiste →</button></div></div><div class="hero-art" role="img" aria-label="Motif abstrait de collection, visuel provisoire"></div></section><div class="cols-3" style="margin-top:18px"><div class="metric"><span>Références envisagées</span><strong>160</strong><span>120 base + 40 collector · en étude</span></div><div class="metric"><span>Athlètes historiques sélectionnés</span><strong>24</strong><span>Aucune statistique historique inventée</span></div><div class="metric"><span>Coût pour tester</span><strong>0 €</strong><span>Aucun paiement ou compte</span></div></div><section class="panel" style="margin-top:18px"><div class="between"><h2>Parcours recommandé</h2><span class="pill">Tout est fictif sauf les 24 noms à l'étude</span></div><div class="cols-3"><div class="stack"><h3>1 — Jouer</h3><p class="muted small">Recevez un starter, ouvrez un booster, construisez un deck et terminez une partie contre ordinateur.</p><button class="btn" data-action="nav" data-id="boosters">Tester les boosters</button></div><div class="stack"><h3>2 — Créer</h3><p class="muted small">Importez localement une image personnelle et visualisez-la dans une maquette de carte 63:88.</p><button class="btn" data-action="nav" data-id="studio">Tester Artist Studio</button></div><div class="stack"><h3>3 — Comprendre</h3><p class="muted small">Simulez des revenus hypothétiques. Aucun droit acquis ni engagement n'est enregistré.</p><button class="btn" data-action="nav" data-id="dashboard">Tester les royalties</button></div></div></section>`}
function catalogue(){const roster=ROSTER.filter(n=>n.toLowerCase().includes(filterCatalogue.toLowerCase()));return `${header()}<h1>Catalogue THE PIONEERS</h1><p class="lead">Sélection éditoriale de 24 athlètes et architecture de 160 références. Les noms et quotas sont prévus pour étude. Les données de jeu, œuvres, codes et grades individuels ne sont pas finalisés.</p><div class="cols-3"><div class="metric"><span>Cartes de base</span><strong>120</strong></div><div class="metric"><span>Collectors</span><strong>40</strong></div><div class="metric"><span>Total à l'étude</span><strong>160</strong></div></div><section class="cols-2" style="margin-top:16px"><div class="panel"><h2>Familles de cartes (base)</h2><div class="table-wrap"><table class="table"><tbody>${FAMILIES.map(([name,n])=>`<tr><td>${name}</td><td style="text-align:right">${n}</td></tr>`).join('')}</tbody></table></div></div><div class="panel"><h2>Quotas des raretés à l'étude</h2><p class="muted small">C/R/SR/L : ancien périmètre canonique ; UC/DR/UR/SEC : non adoptés officiellement.</p><div class="table-wrap"><table class="table"><tbody>${GRADES.map(([g,n])=>`<tr><td>${g}</td><td style="text-align:right">${n}</td></tr>`).join('')}</tbody></table></div></div></section><section class="panel" style="margin-top:16px"><div class="between"><h2>Les 24 athlètes candidats</h2><div style="width:min(100%,290px)"><label for="search-roster">Rechercher un athlète</label><input id="search-roster" value="${html(filterCatalogue)}" placeholder="Ex. Sandow"></div></div><div class="cols-4">${roster.map((n)=>`<div class="metric" style="padding:15px"><span>Candidat historique</span><h3 style="margin:7px 0">${html(n)}</h3><span>Fiche de jeu : à documenter</span></div>`).join('')||'<p class="muted">Aucun résultat.</p>'}</div></section>`}
function boosters(){const has=state.starter;return `${header()}<h1>Boosters et starter</h1><p class="lead">Toutes les cartes ci-dessous sont des **prototypes fictifs**. Elles ne représentent pas les véritables fiches des 24 athlètes historiques. Aucun achat n'est proposé.</p><div class="cols-3"><div class="metric"><span>Starter</span><strong>${has?'Reçu':'À récupérer'}</strong><span>20 cartes de démonstration</span></div><div class="metric"><span>Boosters ouverts</span><strong>${state.opened}</strong><span>5 cartes fictives par booster</span></div><div class="metric"><span>Total d'exemplaires</span><strong>${totalOwned()}</strong><span>Sur cet appareil uniquement</span></div></div><section class="panel" style="margin-top:18px"><div class="between"><div><h2>Votre premier paquet</h2><p class="muted small">Pour tester immédiatement le deck 6 athlètes / 8 techniques / 4 équipements / 2 événements.</p></div><button class="btn primary" data-action="starter" ${has?'disabled':''}>${has?'✓ Starter attribué':'Recevoir 20 cartes fictives'}</button></div></section><section class="panel" style="margin-top:16px"><div class="between"><div><h2>Booster de démonstration</h2><p class="muted small">Tirage aléatoire local ; probabilité de démonstration sans lien avec un futur produit commercial.</p></div><button class="btn primary" data-action="booster" ${has?'':'disabled'}>✦ Ouvrir 5 cartes — gratuit</button></div>${state.drawn.length?`<div class="cards" style="margin-top:18px">${state.drawn.map(id=>card(CARD_MAP[id])).join('')}</div>`:'<div class="mutedblock">Les cartes révélées apparaîtront ici après ouverture.</div>'}</section>`}
function album(){const owned=DEMO_CARDS.filter(c=>currentCount(c.id)>0&&(filterAlbum==='tous'||c.type===filterAlbum));return `${header()}<h1>Mon album</h1><p class="lead">Collection de démonstration persistante dans votre navigateur. Une illustration n'est jamais une nouvelle carte jouable si elle partage la même identité de jeu.</p><div class="between"><div class="flex"><span class="pill gold">${totalOwned()} exemplaires</span><span class="pill">${Object.keys(state.inv).filter(id=>state.inv[id]>0).length} modèles distincts</span></div><div style="width:185px"><label for="album-type">Type de carte</label><select id="album-type"><option value="tous">Tous</option>${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${filterAlbum===k?'selected':''}>${v}</option>`).join('')}</select></div></div><section class="cards" style="margin-top:20px">${owned.map(c=>card(c,currentCount(c.id))).join('')||'<div class="mutedblock">Votre album est vide : récupérez le starter dans Boosters.</div>'}</section>`}
function deck(){const counts=deckQuotaCounts(),issues=deckIssues(),usable=DEMO_CARDS.filter(c=>currentCount(c.id)>0);return `${header()}<h1>Mon deck</h1><p class="lead">Composition du prototype : 20 cartes, dont 6 athlètes uniques, 8 techniques, 4 équipements et 2 événements. Les nouveaux types de carte de THE PIONEERS restent à l'étude.</p><div class="cols-4">${Object.entries(QUOTAS).map(([k,n])=>`<div class="metric"><span>${TYPES[k]}</span><strong style="color:${counts[k]===n?'var(--green)':'var(--gold)'}">${counts[k]}/${n}</strong></div>`).join('')}</div><section class="panel" style="margin-top:18px"><div class="between"><div><h2>Éditeur interactif</h2><p class="muted small">${issues.length?`À corriger : ${html(issues.slice(0,3).join(' · '))}`:'✓ Deck valide pour le duel DEMO'}</p></div><button class="btn" data-action="reset-deck" ${state.starter?'':'disabled'}>Réinitialiser le deck au starter</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Carte de démonstration</th><th>Type</th><th>Possédé</th><th>Dans le deck</th><th>Modifier</th></tr></thead><tbody>${usable.map(c=>`<tr><td>${html(c.nom)}</td><td>${TYPES[c.type]}</td><td>${currentCount(c.id)}</td><td>${deckCount(c.id)}</td><td><button class="btn smallbtn" data-action="deck-change" data-id="${c.id}" data-delta="-1" aria-label="Retirer ${html(c.nom)}">−</button> <button class="btn smallbtn" data-action="deck-change" data-id="${c.id}" data-delta="1" aria-label="Ajouter ${html(c.nom)}">+</button></td></tr>`).join('')||'<tr><td colspan="5">Recevez d’abord votre starter.</td></tr>'}</tbody></table></div></section><div class="flex" style="margin-top:15px"><button class="btn primary" data-action="nav" data-id="arene" ${issues.length?'disabled':''}>Jouer avec ce deck →</button><span class="small muted">Le moteur de duel est volontairement simplifié et non homologué.</span></div>`}
function arene(){const issues=deckIssues();const round=state.rounds.length;const used=new Set(state.rounds.map(r=>r.playerId));const athletes=DEMO_CARDS.filter(c=>c.type==='athlete'&&deckCount(c.id)>0&&!used.has(c.id));let panel='';if(!state.starter)panel='<div class="mutedblock">Recevez d’abord un starter dans « Boosters ».</div>';
else if(issues.length)panel=`<div class="mutedblock">Deck invalide : ${html(issues.join(' · '))}.</div>`;
else if(round>=3){const ours=state.rounds.reduce((a,r)=>a+r.playerScore,0),theirs=state.rounds.reduce((a,r)=>a+r.botScore,0);panel=`<div class="panel"><span class="eyebrow">DUEL TERMINÉ</span><h2>${ours>theirs?'Victoire du joueur':ours<theirs?'Victoire du bot':'Égalité'}</h2><div class="cols-2"><div class="metric"><span>Votre score</span><strong>${ours}</strong></div><div class="metric"><span>Score ordinateur</span><strong>${theirs}</strong></div></div><div style="margin-top:18px"><button class="btn primary" data-action="arena-reset">Nouvelle partie</button></div></div>`}
else panel=`<div class="panel"><h2>Manche ${round+1} sur 3</h2><p class="muted small">Choisissez un athlète encore disponible et une caractéristique principale. Score provisoire : 2 × statistique principale + statistique suivante. Le bot choisit un adversaire prédéterminé. Règle de démonstration, pas règlement officiel.</p><div class="formrow"><div><label for="arena-athlete">Mon athlète fictif</label><select id="arena-athlete">${athletes.map(c=>`<option value="${c.id}">${html(c.nom)} — F:${c.stats[0]} T:${c.stats[1]} E:${c.stats[2]} I:${c.stats[3]}</option>`).join('')}</select></div><div><label for="arena-stat">Caractéristique du défi</label><select id="arena-stat">${STAT_NAMES.map(([k,n],i)=>`<option value="${i}">${n}</option>`).join('')}</select></div></div><button style="margin-top:18px" class="btn primary" data-action="arena-play">Disputer la manche →</button></div>`;
return `${header()}<h1>ARENA — Entraînement</h1><p class="lead">Jouez une partie complète contre ordinateur. Toutes les valeurs sont fictives ; elles ne remplacent pas les règles historiques et tactiques en cours d'étude.</p><div class="cols-3"><div class="metric"><span>Manches jouées</span><strong>${round}/3</strong></div><div class="metric"><span>Victoires de manches</span><strong>${state.rounds.filter(r=>r.playerScore>r.botScore).length}</strong></div><div class="metric"><span>Parties terminées</span><strong>${state.matches.length}</strong></div></div><div style="margin-top:18px">${panel}</div>${round?`<section class="panel" style="margin-top:18px"><h2>Historique du duel</h2><div class="table-wrap"><table class="table"><thead><tr><th>Manche</th><th>Votre athlète</th><th>Caractéristique</th><th>Vous</th><th>Bot</th></tr></thead><tbody>${state.rounds.map((r,i)=>`<tr><td>${i+1}</td><td>${html(CARD_MAP[r.playerId].nom)}</td><td>${STAT_NAMES[r.stat][1]}</td><td>${r.playerScore}</td><td>${r.botScore}</td></tr>`).join('')}</tbody></table></div></section>`:''}`}
function echanges(){const possible=DEMO_CARDS.filter(c=>currentCount(c.id)>Math.max(deckCount(c.id),1));return `${header()}<h1>Échanges — simulation</h1><p class="lead">Échange contre un partenaire virtuel fictif, sans autre utilisateur ni valeur commerciale. Le transfert de deux cartes est réalisé ensemble dans l'inventaire local.</p><div class="cols-2"><div class="panel"><h2>Votre proposition</h2><p class="muted small">Seules les cartes en double et non requises par le deck sont proposées pour éviter d'invalider le starter.</p><label for="trade-card">Carte donnée</label><select id="trade-card">${possible.map(c=>`<option value="${c.id}">${html(c.nom)} (×${currentCount(c.id)})</option>`).join('')}</select><button class="btn primary" style="margin-top:12px" data-action="trade" ${possible.length?'':'disabled'}>Valider cet échange fictif</button>${possible.length?'':'<p class="small muted" style="margin-top:14px">Ouvrez des boosters pour obtenir des doublons.</p>'}</div><div class="panel"><h2>Votre partenaire DEMO</h2><span class="pill">Bot test · aucune personne réelle</span><div class="mutedblock" style="margin-top:12px">Offre : 1 carte « Technique test 12 » pour une de vos cartes en double disponibles.</div><p class="small muted" style="margin-top:13px">Aucun argent ni contrat. Une copie du modèle test est ajoutée et une de vos copies est retirée.</p></div></div><section class="panel" style="margin-top:18px"><h2>Historique des échanges</h2>${state.trades.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Don</th><th>Reçu</th><th>Statut</th></tr></thead><tbody>${state.trades.slice().reverse().map(t=>`<tr><td>${html(CARD_MAP[t.give]?.nom)}</td><td>${html(CARD_MAP[t.receive]?.nom)}</td><td>Conclu · fictif</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted small">Aucun échange de démonstration.</p>'}</section>`}
function studio(){return `${header()}<h1>Artist Studio</h1><p class="lead">ATHLETIC MASTERS définit les sujets et les faits ; l'artiste choisit son style. Votre image reste locale, n'est ni publiée ni cédée, et ne crée aucune commande ou rémunération.</p><div class="cols-2"><section class="panel"><h2>Créer un aperçu de carte</h2><div class="stack"><div><label for="artist-alias">Nom ou pseudonyme de démonstration</label><input id="artist-alias" value="${html(state.alias)}" maxlength="60"></div><div><label for="artist-subject">Sujet éditorial attribué (étude)</label><select id="artist-subject">${ROSTER.map(n=>`<option value="${html(n)}" ${state.subject===n?'selected':''}>${html(n)}</option>`).join('')}</select></div><div><label for="artist-grade">Grade envisagé</label><select id="artist-grade">${GRADES.map(([g])=>`<option ${state.grade===g?'selected':''} value="${g}">${g}${['UC','DR','UR','SEC'].includes(g)?' (à l’étude)':''}</option>`).join('')}</select></div><div><label for="artist-image">Importer une illustration sur votre appareil (PNG/JPG/WEBP)</label><input type="file" accept="image/png,image/jpeg,image/webp" id="artist-image"><p class="tiny muted">L'image ne sort pas du navigateur. Aperçu perdu lorsque vous fermez l'onglet.</p></div><div class="flex"><button class="btn" data-action="studio-apply">Actualiser l'aperçu</button><button class="btn danger" data-action="studio-remove">Effacer l'image</button></div></div></section><section class="panel"><h2>Votre œuvre dans le jeu</h2><div class="flex" style="align-items:flex-start"><div class="art-preview"><div class="between"><span class="tiny">ATHLETIC MASTERS</span><span class="pill gold">${state.grade}</span></div>${previewUrl?`<img alt="Illustration chargée localement pour aperçu" src="${previewUrl}">`:'<div class="art-stage">Aucune œuvre importée</div>'}<div class="tcg-name">${html(state.subject)}</div><div class="artist-stats"><span>FOR —</span><span>TEC —</span><span>END —</span><span>IMP —</span></div><div class="tcg-foot">Illustration : ${html(state.alias)} · MAQUETTE</div></div><div class="stack" style="flex:1;min-width:160px"><span class="pill gold">Droits non transférés</span><p class="small muted">Carte au ratio 63:88. Les champs historiques, capacités et statistiques restent non attribués jusqu'à validation. Votre style est entièrement libre.</p><p class="small muted">Cet aperçu n'est pas une soumission, n'enregistre aucun fichier sur serveur et ne vous engage à rien.</p></div></div></section></div><section class="panel" style="margin-top:18px"><h2>Premiers briefs possibles</h2><div class="cols-3">${ROSTER.slice(0,3).map(n=>`<div class="metric"><span>À documenter</span><h3 style="margin:8px 0">${html(n)}</h3><p class="small muted">ATHLETIC MASTERS définira la scène sourcée et les conditions exactes.</p></div>`).join('')}</div></section>`}
function dashboard(){const s=state.sim,b=s.boosters*.25,a=s.abos*.12,p=s.physique*.06,total=b+a+p;return `${header()}<h1>Artist Dashboard</h1><div class="panel" style="border-color:#7a6948;background:#272638"><span class="eyebrow">SIMULATION FINANCIÈRE — AUCUN CONTRAT</span><h2 style="margin:12px 0">0 € de droits réellement acquis</h2><p class="small muted" style="margin-bottom:0">Les taux affichés ne sont pas approuvés, aucune vente réelle n'est comptabilisée et aucun artiste ne possède de créance du fait de ce simulateur.</p></div><section class="cols-2" style="margin-top:16px"><div class="panel"><h2>Hypothèses modifiables</h2>${[['boosters','Recettes éligibles boosters',50000,500],['abos','Recettes éligibles abonnements',100000,1000],['physique','Recettes éligibles physiques',50000,500],['artistes','Artistes participants',40,1]].map(([id,label,max,step])=>`<div style="margin:16px 0"><div class="between"><label for="sim-${id}">${label}</label><strong>${id==='artistes'?s[id]:money(s[id])}</strong></div><input id="sim-${id}" type="range" min="${id==='artistes'?1:0}" max="${max}" step="${step}" value="${s[id]}"></div>`).join('')}<p class="tiny muted">Hypothèses : 25 % boosters / 12 % abonnements / 6 % physiques. Partage fictif égal pour l'exemple ; aucune clé contractuelle adoptée.</p></div><div class="panel"><h2>Calcul fictif mensuel</h2><div class="cols-2"><div class="metric"><span>Pool boosters</span><strong>${money(b)}</strong></div><div class="metric"><span>Pool abonnements</span><strong>${money(a)}</strong></div><div class="metric"><span>Pool physique</span><strong>${money(p)}</strong></div><div class="metric"><span>Total répartissable</span><strong>${money(total)}</strong></div></div><div class="metric" style="margin-top:16px;border-color:#7a6948"><span>Moyenne théorique par artiste (si parts égales)</span><strong style="color:var(--gold)">${money(total/s.artistes)}</strong></div><p class="tiny muted" style="margin-top:12px">Le futur mécanisme sera basé sur les œuvres effectivement exploitées, la présence des illustrations et les contrats. Les rares ne doivent pas être pénalisées par leurs fréquences de tirage.</p></div></section>`}
function feedback(){return `${header()}<h1>Retours de bêta</h1><p class="lead">Notez les difficultés rencontrées puis exportez votre retour au format JSON. Rien n'est envoyé automatiquement à ATHLETIC MASTERS.</p><div class="cols-2"><section class="panel"><h2>Donnez votre avis</h2><div class="stack"><div><label for="feed-rate">Votre appréciation</label><select id="feed-rate"><option value="5">5 — Très convaincant</option><option value="4">4 — Convaincant</option><option value="3">3 — Moyen</option><option value="2">2 — Difficile à utiliser</option><option value="1">1 — Inutilisable</option></select></div><div><label for="feed-text">Bug, amélioration ou impression</label><textarea id="feed-text" placeholder="Ex. Le deck est difficile à comprendre..."></textarea></div><div class="flex"><button class="btn primary" data-action="save-feedback">Enregistrer localement</button><button class="btn" data-action="export-feedback">Exporter mes retours JSON</button></div></div></section><section class="panel"><h2>Vos retours conservés ici</h2>${state.notes.length?state.notes.slice().reverse().map(n=>`<div class="mutedblock" style="margin-top:12px"><strong>${n.rating}/5</strong><p>${html(n.note)}</p><span class="tiny muted">${html(n.date)}</span></div>`).join(''):'<div class="mutedblock">Aucun retour enregistré.</div>'}</section></div>`}
const VIEW={accueil,catalogue,boosters,album,deck,arene,echanges,studio,dashboard,feedback};
function render(){const nav=[['accueil','⌂','Accueil'],['catalogue','▦','Catalogue'],['boosters','✦','Boosters'],['album','▣','Album'],['deck','♜','Decks'],['arene','⚔','ARENA'],['echanges','↔','Échanges'],['studio','✎','Artist Studio'],['dashboard','◈','Royalties'],['feedback','◉','Feedback']];document.getElementById('app').innerHTML=`<div class="layout"><aside class="sidebar"><div class="brand"><div><div class="brandmark">ATHLETIC<br><span>MASTERS</span></div><div class="eyebrow" style="margin-top:11px">ARTIST BETA · V0.2</div></div><span class="tag">DÉMO</span></div><nav class="sidenav" aria-label="Navigation de la démo">${nav.map(([id,sym,name])=>navButton(id,sym,name)).join('')}</nav><div class="side-note">Application de présentation hors ligne. Aucun paiement, compte, contrat, stockage distant ou illustration historique validée.<br><br><button class="btn smallbtn ghost" data-action="export-state">Exporter l'état démo</button></div></aside><main class="main">${(VIEW[screen]||accueil)()}<footer class="footer">© ATHLETIC MASTERS — VERSION PROTOTYPE. Cible 160 références en étude · cartes de jeu fictives · artistes non contractés · zéro transaction.</footer></main></div>`}
function toast(msg){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t)}t.textContent=msg;clearTimeout(notifTimer);notifTimer=setTimeout(()=>t.remove(),4200)}
function goto(view){screen=view;render();window.scrollTo({top:0,behavior:'instant'})}
function addInv(id,n=1){state.inv[id]=(state.inv[id]||0)+n;if(state.inv[id]<=0)delete state.inv[id]}
function addStarter(){if(state.starter)return;STARTER.forEach(c=>{addInv(c.id);state.deck[c.id]=(state.deck[c.id]||0)+1});state.starter=true;persist();render();toast('Starter DEMO : 20 cartes fictives reçues.')}
function openBooster(){if(!state.starter)return toast('Recevez le starter avant les boosters.');const pool=DEMO_CARDS.map(c=>c.id);const res=[];for(let i=0;i<5;i++){const id=pool[Math.floor(Math.random()*pool.length)];addInv(id);res.push(id)}state.drawn=res;state.opened++;persist();render();toast('5 cartes DEMO ajoutées à l’album.')}
function changeDeck(id,d){const c=CARD_MAP[id];if(!c)return;const max=Math.min(currentCount(id),c.type==='athlete'?1:2);state.deck[id]=Math.max(0,Math.min(max,deckCount(id)+d));if(!state.deck[id])delete state.deck[id];persist();render()}
function resetDeck(){if(!state.starter)return;state.deck={};for(const c of STARTER){if(currentCount(c.id))state.deck[c.id]=1}state.rounds=[];persist();render();toast('Deck du starter restauré.')}
function playRound(){if(deckIssues().length||state.rounds.length>=3)return;const a=CAT('arena-athlete'),idx=Number(CAT('arena-stat'));const c=CARD_MAP[a];if(!c||c.type!=='athlete'||state.rounds.some(x=>x.playerId===a)||idx<0||idx>3)return;const round=state.rounds.length,bot=DEMO_CARDS[(round+2)%6];const playerScore=2*c.stats[idx]+c.stats[(idx+1)%4],botScore=2*bot.stats[idx]+bot.stats[(idx+1)%4];state.rounds.push({playerId:a,botId:bot.id,stat:idx,playerScore,botScore});if(state.rounds.length===3){state.matches.push({date:new Date().toISOString(),result:state.rounds.map(x=>[x.playerScore,x.botScore])})}persist();render();toast('Manche terminée : '+playerScore+' – '+botScore)}
function CAT(id){return document.getElementById(id)?.value??''}
function runTrade(){const give=CAT('trade-card');if(!CARD_MAP[give])return;const need=Math.max(deckCount(give),1);if(currentCount(give)<=need)return toast('Aucun doublon disponible pour cet échange.');addInv(give,-1);const receive='DEMO-T12';addInv(receive);state.trades.push({give,receive,date:new Date().toISOString()});persist();render();toast('Échange de démonstration effectué.')}
function updateStudio(){state.alias=CAT('artist-alias').trim().slice(0,60)||'Artiste invité';state.subject=CAT('artist-subject')||ROSTER[0];state.grade=CAT('artist-grade')||'C';persist();render();toast('Aperçu actualisé, sans publication.')}
function downloadJSON(object,file){const blob=new Blob([JSON.stringify(object,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=file;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function handleAction(e){const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const act=b.dataset.action;switch(act){case'nav':goto(b.dataset.id);break;case'open-card':showCardDetails(b.dataset.id);break;case'mode':state.mode=b.dataset.id;persist();goto(b.dataset.id==='artiste'?'studio':'boosters');break;case'starter':addStarter();break;case'booster':openBooster();break;case'deck-change':changeDeck(b.dataset.id,Number(b.dataset.delta));break;case'reset-deck':resetDeck();break;case'arena-play':playRound();break;case'arena-reset':state.rounds=[];persist();render();break;case'trade':runTrade();break;case'studio-apply':updateStudio();break;case'studio-remove':if(previewUrl){URL.revokeObjectURL(previewUrl);previewUrl=null}render();toast('Image supprimée de cet aperçu.');break;case'save-feedback':{const note=CAT('feed-text').trim();if(!note){toast('Saisissez un commentaire avant de l’enregistrer.');break}state.notes.push({rating:Number(CAT('feed-rate')),note,date:new Date().toISOString()});persist();render();toast('Retour enregistré uniquement dans ce navigateur.');break}case'export-feedback':downloadJSON(state.notes,'athletic-masters-retours-demo.json');break;case'export-state':downloadJSON({version:'0.2',demo:true,...state},'athletic-masters-etat-demo.json');break}}
document.addEventListener('click',handleAction);
document.addEventListener('change',e=>{if(e.target.id==='album-type'){filterAlbum=e.target.value;render()}else if(e.target.id.startsWith('sim-')){const field=e.target.id.slice(4);if(Object.prototype.hasOwnProperty.call(state.sim,field)){state.sim[field]=Number(e.target.value);persist();render()}}else if(e.target.id==='artist-image'){const file=e.target.files?.[0];if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>10*1024*1024){toast('Image PNG, JPG ou WEBP limitée à 10 Mo.');return}if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=URL.createObjectURL(file);render();toast('Image chargée en mémoire locale seulement.') }});
document.addEventListener('input',e=>{if(e.target.id==='search-roster'){filterCatalogue=e.target.value;const pos=e.target.selectionStart;render();const el=document.getElementById('search-roster');el.focus();el.setSelectionRange(pos,pos)}});
render();
</script></body></html>
